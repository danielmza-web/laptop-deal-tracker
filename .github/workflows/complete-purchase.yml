name: Complete purchase and stop tracking

on:
  workflow_dispatch:
    inputs:
      laptop:
        description: "Purchased laptop"
        required: true
        type: string
      price:
        description: "Final price in EUR"
        required: true
        type: string
      purchase_date:
        description: "Purchase date (YYYY-MM-DD)"
        required: true
        type: string

permissions:
  contents: write
  actions: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
      - name: Get data branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git clone --depth 1 --branch data "$remote" data-store
      - name: Record final purchase and create archive snapshot
        env:
          PURCHASED_LAPTOP: ${{ inputs.laptop }}
          PURCHASE_PRICE: ${{ inputs.price }}
          PURCHASE_DATE: ${{ inputs.purchase_date }}
        shell: bash
        run: |
          python -c 'import json,os,pathlib; pathlib.Path("data-store/public-data/purchase.json").write_text(json.dumps({"laptop":os.environ["PURCHASED_LAPTOP"],"price":float(os.environ["PURCHASE_PRICE"]),"date":os.environ["PURCHASE_DATE"]},indent=2)+"\n",encoding="utf-8")'
          cd source
          python -m tracker --offline --previous ../data-store/public-data --output ../archive-data
          cd ..
          rm -rf data-store/public-data
          cp -R archive-data data-store/public-data
          git -C data-store config user.name "Laptop Deal Tracker"
          git -C data-store config user.email "actions@users.noreply.github.com"
          git -C data-store add public-data
          git -C data-store commit -m "data: archive completed purchase"
          git -C data-store push origin data
      - name: Disable scheduled tracking
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl --fail-with-body --request PUT \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/tracker.yml/disable"

